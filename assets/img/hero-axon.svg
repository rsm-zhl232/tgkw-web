<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 760" fill="none" aria-hidden="true" preserveAspectRatio="xMidYMid meet">
  <defs>
    <linearGradient id="gPlate" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#F2F1ED" stop-opacity=".62"/>
      <stop offset="55%" stop-color="#9FC4FF" stop-opacity=".34"/>
      <stop offset="100%" stop-color="#F2F1ED" stop-opacity=".10"/>
    </linearGradient>
    <linearGradient id="gEdge" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#7FB2FF" stop-opacity=".95"/>
      <stop offset="100%" stop-color="#1669E5" stop-opacity=".22"/>
    </linearGradient>
    <linearGradient id="gFill" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4E92FF" stop-opacity=".16"/>
      <stop offset="100%" stop-color="#1669E5" stop-opacity=".02"/>
    </linearGradient>
    <linearGradient id="gCol" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4E92FF" stop-opacity=".08"/>
      <stop offset="45%" stop-color="#8FBCFF" stop-opacity=".55"/>
      <stop offset="100%" stop-color="#4E92FF" stop-opacity=".08"/>
    </linearGradient>
    <radialGradient id="gPool" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#4E92FF" stop-opacity=".40"/>
      <stop offset="100%" stop-color="#4E92FF" stop-opacity="0"/>
    </radialGradient>
    <filter id="fGlow" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="5" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="fSoft" x="-80%" y="-80%" width="260%" height="260%">
      <feGaussianBlur stdDeviation="9"/>
    </filter>
  </defs>
  <style>
    :root{ --e:cubic-bezier(.22,.61,.36,1); }
    *{ transform-box:view-box; }
    .pool{ animation: poolBreathe 7s ease-in-out infinite; }
    @keyframes poolBreathe{ 0%,100%{ opacity:.55 } 50%{ opacity:1 } }
    .radar .ring{ transform-box:fill-box; transform-origin:center; opacity:0;
      animation: ringOut 6s cubic-bezier(.25,.6,.3,1) infinite; }
    .radar .r1{ animation-delay:2s } .radar .r2{ animation-delay:4s }
    @keyframes ringOut{
      0%{ transform:scale(.18); opacity:0 }
      12%{ opacity:.5 }
      100%{ transform:scale(1.1); opacity:0 }
    }
    .col.c0{ stroke-dasharray:340; animation: draw0col 1.1s var(--e) 0.25s both }@keyframes draw0col{ from{ stroke-dashoffset:340 } to{ stroke-dashoffset:0 } }
    .col.c1{ stroke-dasharray:340; animation: draw1col 1.1s var(--e) 0.33s both }@keyframes draw1col{ from{ stroke-dashoffset:340 } to{ stroke-dashoffset:0 } }
    .col.c2{ stroke-dasharray:340; animation: draw2col 1.1s var(--e) 0.41s both }@keyframes draw2col{ from{ stroke-dashoffset:340 } to{ stroke-dashoffset:0 } }
    .col.c3{ stroke-dasharray:340; animation: draw3col 1.1s var(--e) 0.49s both }@keyframes draw3col{ from{ stroke-dashoffset:340 } to{ stroke-dashoffset:0 } }
    .col.c4{ stroke-dasharray:340; animation: draw4col 1.1s var(--e) 0.57s both }@keyframes draw4col{ from{ stroke-dashoffset:340 } to{ stroke-dashoffset:0 } }
    .col.c5{ stroke-dasharray:340; animation: draw5col 1.1s var(--e) 0.65s both }@keyframes draw5col{ from{ stroke-dashoffset:340 } to{ stroke-dashoffset:0 } }
    .lvl.l0{ animation: rise 1.15s var(--e) 0.00s both }
    .l0 .edge{ stroke-dasharray:1340.6; animation: drawEdge 1.5s var(--e) 0.10s both }
    .l0 .joists line{ stroke-dasharray:335.1; animation: drawJoist 1.3s var(--e) 0.50s both }
    .lvl.l1{ animation: rise 1.15s var(--e) 0.14s both }
    .l1 .edge{ stroke-dasharray:1340.6; animation: drawEdge 1.5s var(--e) 0.24s both }
    .l1 .joists line{ stroke-dasharray:335.1; animation: drawJoist 1.3s var(--e) 0.64s both }
    .lvl.l2{ animation: rise 1.15s var(--e) 0.28s both }
    .l2 .edge{ stroke-dasharray:1340.6; animation: drawEdge 1.5s var(--e) 0.38s both }
    .l2 .joists line{ stroke-dasharray:335.1; animation: drawJoist 1.3s var(--e) 0.78s both }
    .lvl.l3{ animation: rise 1.15s var(--e) 0.42s both }
    .l3 .edge{ stroke-dasharray:1340.6; animation: drawEdge 1.5s var(--e) 0.52s both }
    .l3 .joists line{ stroke-dasharray:335.1; animation: drawJoist 1.3s var(--e) 0.92s both }
    .lvl.l4{ animation: rise 1.15s var(--e) 0.56s both }
    .l4 .edge{ stroke-dasharray:1340.6; animation: drawEdge 1.5s var(--e) 0.66s both }
    .l4 .joists line{ stroke-dasharray:335.1; animation: drawJoist 1.3s var(--e) 1.06s both }
    
    .stack{ animation: bob 9s ease-in-out infinite; }
    @keyframes bob{ 0%,100%{ transform:translateY(-5px) } 50%{ transform:translateY(7px) } }
    @keyframes rise{ from{ opacity:0; transform:translateY(54px) } to{ opacity:1; transform:translateY(0) } }
    @keyframes drawEdge{ from{ stroke-dashoffset:var(--o, 1341) } to{ stroke-dashoffset:0 } }
    @keyframes drawJoist{ from{ stroke-dashoffset:336; opacity:0 } 40%{ opacity:1 } to{ stroke-dashoffset:0; opacity:1 } }
    .halo{ transform-box:fill-box; transform-origin:center; animation: halo 3.4s ease-in-out infinite; }
    .nodes .halo:nth-of-type(3){ animation-delay:.9s } .nodes .halo:nth-of-type(5){ animation-delay:1.8s }
    .nodes .halo:nth-of-type(7){ animation-delay:2.6s }
    @keyframes halo{ 0%,100%{ transform:scale(.7); opacity:.25 } 50%{ transform:scale(1.5); opacity:.9 } }
    .l0 .edge{ --o:1340.6 }
    .l1 .edge{ --o:1340.6 }
    .l2 .edge{ --o:1340.6 }
    .l3 .edge{ --o:1340.6 }
    .l4 .edge{ --o:1340.6 }
    
    .scan{ animation: scanUp 5.2s linear infinite; }
    @keyframes scanUp{
      0%{ transform:translateY(24px); opacity:0 }
      10%{ opacity:.95 }
      85%{ opacity:.35 }
      100%{ transform:translateY(-380px); opacity:0 }
    }
    
    .pulse{ animation: coreUp 3.2s cubic-bezier(.4,0,.5,1) infinite; }
    .pulse.p1{ animation-delay:1.6s }
    @keyframes coreUp{
      0%{ transform:translateY(0); opacity:0 }
      12%{ opacity:1 }
      88%{ opacity:1 }
      100%{ transform:translateY(-340px); opacity:0 }
    }
    .pk.k0{ animation: pk0 3.60s linear 0.90s infinite }@keyframes pk0{ 0%{ transform:translate(0,0); opacity:0 } 12%{ opacity:1 } 80%{ opacity:1 } 100%{ transform:translate(290px,-168px); opacity:0 } }
    .pk.k1{ animation: pk1 4.15s linear 1.60s infinite }@keyframes pk1{ 0%{ transform:translate(0,0); opacity:0 } 12%{ opacity:1 } 80%{ opacity:1 } 100%{ transform:translate(290px,168px); opacity:0 } }
    .pk.k2{ animation: pk2 4.70s linear 2.30s infinite }@keyframes pk2{ 0%{ transform:translate(0,0); opacity:0 } 12%{ opacity:1 } 80%{ opacity:1 } 100%{ transform:translate(290px,168px); opacity:0 } }
    .pk.k3{ animation: pk3 5.25s linear 3.00s infinite }@keyframes pk3{ 0%{ transform:translate(0,0); opacity:0 } 12%{ opacity:1 } 80%{ opacity:1 } 100%{ transform:translate(290px,-168px); opacity:0 } }
    .pk.k4{ animation: pk4 5.80s linear 3.70s infinite }@keyframes pk4{ 0%{ transform:translate(0,0); opacity:0 } 12%{ opacity:1 } 80%{ opacity:1 } 100%{ transform:translate(290px,168px); opacity:0 } }
    .pk.k5{ animation: pk5 6.35s linear 4.40s infinite }@keyframes pk5{ 0%{ transform:translate(0,0); opacity:0 } 12%{ opacity:1 } 80%{ opacity:1 } 100%{ transform:translate(290px,-168px); opacity:0 } }
    .pk.k6{ animation: pk6 6.90s linear 5.10s infinite }@keyframes pk6{ 0%{ transform:translate(0,0); opacity:0 } 12%{ opacity:1 } 80%{ opacity:1 } 100%{ transform:translate(290px,168px); opacity:0 } }
    .pk.k7{ animation: pk7 7.45s linear 5.80s infinite }@keyframes pk7{ 0%{ transform:translate(0,0); opacity:0 } 12%{ opacity:1 } 80%{ opacity:1 } 100%{ transform:translate(290px,-168px); opacity:0 } }
    
    .march{ animation: march 2.4s linear infinite; }
    .march.m2{ animation-duration:3.4s }
    @keyframes march{ to{ stroke-dashoffset:-24 } }
    .tk{ animation: tick 1s var(--e) both; }
    .tk.t0{ animation-delay:0.70s }
    .tk.t1{ animation-delay:0.84s }
    .tk.t2{ animation-delay:0.98s }
    .tk.t3{ animation-delay:1.12s }
    .tk.t4{ animation-delay:1.26s }
    @keyframes tick{ from{ opacity:0; transform:translateX(-14px) } to{ opacity:1; transform:none } }
    @media (prefers-reduced-motion:reduce){
      *{ animation:none !important }
      .scan,.packets,.pulses,.radar{ display:none }
    }
  </style>
